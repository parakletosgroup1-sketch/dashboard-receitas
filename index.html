<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Receitas — Meta Ads</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--blue-dim:rgba(59,130,246,.12);--blue-glow:rgba(59,130,246,.35);--blue-dark:#1d4ed8;--green:#22c55e;--gold:#f59e0b;--red:#ef4444;--purple:#a78bfa;--bg:#070709;--surface:#0f1014;--surface2:#15171d;--border:#1e2028;--text:#f1f1f3;--muted:#5a5d6b;--subtle:#2a2d38}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#2a2d38;border-radius:4px}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.header{background:linear-gradient(135deg,#0a0f1e,#0f1a2e);border:1px solid #1a2540;border-radius:16px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hb{display:flex;align-items:center;gap:12px}
.hlogo{width:40px;height:40px;background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 16px var(--blue-glow);flex-shrink:0}
.htitle{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.3px}.hsub{font-size:10px;color:var(--muted);margin-top:1px}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hbadge{display:flex;align-items:center;gap:7px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);padding:6px 12px;border-radius:7px;font-size:10px;font-weight:700;color:var(--blue)}
.pdot{width:6px;height:6px;background:var(--blue);border-radius:50%;animation:pdot 1.5s infinite}@keyframes pdot{0%,100%{opacity:1}50%{opacity:.3}}
select,input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:11px;font-weight:700;font-family:inherit;outline:none}
input{width:92px}select:focus,input:focus{border-color:var(--blue)}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px 16px;position:relative;overflow:hidden}
.kpi-bar{position:absolute;top:0;left:0;width:3px;height:100%}.kpi-icon{font-size:16px;margin-bottom:5px;display:block}
.kpi-v{font-size:24px;font-weight:900;line-height:1;letter-spacing:-1px;color:#fff}
.kpi-l{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:18px}
.ctitle{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cmp{width:100%;border-collapse:collapse}
.cmp th{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700;padding:6px 9px;text-align:left;border-bottom:1px solid var(--border)}
.cmp td{padding:8px 9px;font-size:13px;font-weight:700;border-bottom:1px solid #0d0e11;font-variant-numeric:tabular-nums}
.cmp tr:last-child td{border-bottom:none}.cl{color:var(--muted);font-size:11px}.cv{color:#fff}.cv.hi{color:var(--green)}
.delta-up,.delta-down{display:inline-flex;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;border:1px solid}
.delta-up{background:rgba(34,197,94,.1);color:var(--green);border-color:rgba(34,197,94,.2)}.delta-down{background:rgba(239,68,68,.1);color:var(--red);border-color:rgba(239,68,68,.2)}
.ga{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px;max-height:640px;overflow-y:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:5px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;outline:none}
.tab.active{background:var(--blue-dim);border-color:rgba(59,130,246,.35);color:var(--blue)}
.spy-count-badge{background:var(--surface2);border:1px solid var(--border);padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;color:var(--muted)}
.spy-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.spy-leg-item{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;color:var(--muted)}.spy-leg-dot{width:10px;height:10px;border-radius:2px}
.spy-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.spy-item.checkout{border-color:rgba(34,197,94,.28);background:rgba(34,197,94,.025)}.spy-item.sale{border-color:rgba(245,158,11,.32);background:rgba(245,158,11,.035)}.spy-item.online-now{border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.03)}
.spy-av{width:34px;height:34px;background:var(--subtle);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted);font-size:12px;flex-shrink:0}
.spy-b{flex:1;min-width:0}.spy-row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.spy-id{font-size:11px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spy-t{font-size:9px;color:var(--muted)}
.tela-badge{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:900;border:1px solid}
.screen-early{background:rgba(59,130,246,.1);color:var(--blue);border-color:rgba(59,130,246,.25)}.screen-mid{background:rgba(245,158,11,.1);color:var(--gold);border-color:rgba(245,158,11,.25)}
.screen-late{background:rgba(167,139,250,.1);color:var(--purple);border-color:rgba(167,139,250,.25)}.screen-checkout{background:rgba(34,197,94,.1);color:var(--green);border-color:rgba(34,197,94,.25)}
.screen-sale{background:rgba(245,158,11,.15);color:var(--gold);border-color:rgba(245,158,11,.3)}
.screen-stepper{display:flex;gap:2px;margin-top:5px}.ss{width:14px;height:10px;border-radius:2px;background:var(--subtle)}
.ss.done{background:var(--blue)}.ss.current{background:var(--gold);animation:sfp .9s infinite alternate}.ss.sale-done{background:var(--green)}@keyframes sfp{0%{opacity:.5}100%{opacity:1}}
.spy-src{font-size:8px;color:var(--blue);font-weight:800;text-transform:uppercase;margin-top:2px;letter-spacing:.3px}
.spy-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.odot{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 7px var(--green)}
.bchk{background:rgba(34,197,94,.1);color:var(--green);font-size:8px;font-weight:900;padding:2px 5px;border-radius:3px;border:1px solid rgba(34,197,94,.28)}
.bsale{background:rgba(245,158,11,.1);color:var(--gold);font-size:8px;font-weight:900;padding:2px 5px;border-radius:3px;border:1px solid rgba(245,158,11,.28)}
.empty{text-align:center;padding:26px;color:var(--muted);font-size:12px;grid-column:1/-1}
.sale-item{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:9px}
.sale-av{width:36px;height:36px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--gold);flex-shrink:0}
.sale-info{flex:1;min-width:0}.sale-name{font-size:12px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sale-meta{font-size:10px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sale-method{background:var(--blue-dim);border:1px solid rgba(59,130,246,.2);color:var(--blue);font-size:8px;font-weight:900;padding:1px 6px;border-radius:3px;text-transform:uppercase}
.sale-amt{font-size:15px;font-weight:900;color:var(--gold);flex-shrink:0}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:9px 16px;border-radius:10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;outline:none;transition:all .15s}
.ptab:hover{color:var(--text)}
.ptab.active{background:var(--blue-dim);border-color:rgba(59,130,246,.45);color:var(--blue);box-shadow:0 0 14px var(--blue-glow)}
</style></head><body>
<div class="wrap">
<div class="ptabs" id="ptabs"></div>
<div class="header"><div class="hb"><div class="hlogo" id="lg">🥗</div><div><div class="htitle" id="ttl">365 Receitas — Meta Ads</div><div class="hsub">Dashboard Tráfego Pago · Facebook &amp; Instagram</div></div></div>
<div class="hr"><select id="src"><option value="meta">Só Meta</option><option value="all">Todas as origens</option></select><input id="spend" inputmode="decimal" placeholder="Gasto hoje R$"><div class="hbadge"><div class="pdot"></div><span id="st">Conectando…</span></div></div></div>

<div class="kpi-strip" id="kpis"></div>

<div class="card"><div class="ctitle">📅 Comparação de Períodos</div>
<div style="overflow-x:auto"><table class="cmp"><thead><tr><th>Métrica</th><th>Hoje</th><th>Ontem</th><th>7 Dias</th><th>30 Dias</th></tr></thead><tbody id="cmp"></tbody></table></div></div>

<div class="card"><div class="ctitle">🕵️ Espião ao Vivo — Etapa por Etapa
<div class="tabs"><button class="tab active" data-f="all">TODOS</button><button class="tab" data-f="online">🟢 ONLINE</button><button class="tab" data-f="checkout">CHECKOUT</button><button class="tab" data-f="sale">VENDAS</button></div>
<span class="spy-count-badge"><strong id="spy-count">0</strong> leads</span></div>
<div class="spy-legend"><div class="spy-leg-item"><div class="spy-leg-dot" style="background:var(--blue)"></div>Etapa concluída</div><div class="spy-leg-item"><div class="spy-leg-dot" style="background:var(--gold)"></div>Etapa atual</div><div class="spy-leg-item"><div class="spy-leg-dot" style="background:var(--green)"></div>Comprou</div><div class="spy-leg-item"><div class="spy-leg-dot" style="background:var(--subtle)"></div>Não atingido</div></div>
<div class="ga" id="spy-grid"><div class="empty">Conectando ao Firebase…</div></div></div>

<div class="card"><div class="ctitle">💰 Últimas Compras
<select id="sales-filter" style="margin-left:auto"><option value="today">Hoje</option><option value="yesterday">Ontem</option><option value="7d" selected>7 Dias</option><option value="30d">30 Dias</option></select></div>
<div id="sales-list" style="display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto"></div></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getFirestore,collection,onSnapshot,limit,query,orderBy}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const CFG={tabs:[{key:'lp-receitas',name:'365 Receitas',icon:'🥗',prices:[10,18],legacy:true},{key:'receitinhas-nanna',name:'Receitinhas da Nanna',icon:'🍼',prices:[10,18]}],pass:'',metaSrc:['facebook','meta','instagram','fb','ig','fb-ads','meta-ads']};
let tab=CFG.tabs[0];
const FB={apiKey:"AIzaSyDs8d7vR6gcqhzycJ3oPokIxnhVT-No6tE",authDomain:"lp-receitas.firebaseapp.com",projectId:"lp-receitas",storageBucket:"lp-receitas.firebasestorage.app",messagingSenderId:"137885130898",appId:"1:137885130898:web:5f76c46e409dba61e6064b"};
if(CFG.pass){let ok=false;try{ok=sessionStorage.getItem('dk')===CFG.pass}catch(e){}if(!ok){const p=prompt('Senha:');if(p!==CFG.pass){document.body.innerHTML='';throw 0}try{sessionStorage.setItem('dk',p)}catch(e){}}}
const $=id=>document.getElementById(id);
const toDate=t=>!t?null:t.toDate?t.toDate():t.seconds?new Date(t.seconds*1e3):new Date(t);
const brl=v=>'R$\u00a0'+Number(v).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paid=s=>s.isPaid===true||s.paid===true||['pago','paid','approved','completed'].includes(String(s.status||'').toLowerCase());
const net=s=>{const v=Number(s.amount||0);return String(s.paymentMethod||'').toLowerCase()==='pix'?v*.95:v*.9};
const ago=t=>{const d=toDate(t);if(!d)return'?';const s=Math.floor((Date.now()-d)/1e3);return s<5?'agora':s<60?s+'s':s<3600?Math.floor(s/60)+'min':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
const range=p=>{const n=new Date(),s=new Date();s.setHours(0,0,0,0);if(p==='yesterday'){const e=new Date(s);e.setMilliseconds(-1);s.setDate(s.getDate()-1);return[s,e]}if(p==='7d')s.setDate(s.getDate()-6);if(p==='30d')s.setDate(s.getDate()-29);return[s,n]};
const inR=(t,r)=>{const d=toDate(t);return d&&d>=r[0]&&d<=r[1]};
const online=s=>{const d=toDate(s.lastActivity);return d&&Date.now()-d<90e3};
const isChk=s=>!!(s.checkout||s.clickedPlan);
const sIdx=s=>isChk(s)?6:s.viewedPlans?5:Math.min(4,Math.round((s.maxScroll||0)/25));
const LBL=['Entrou na página','Rolou 25%','Rolou 50%','Rolou 75%','Rolou 100%','Viu os planos','Foi pro checkout'];
const planOf=s=>s.clickedPlan==='p1'?'R$'+tab.prices[0]:s.clickedPlan==='p2'?'R$'+tab.prices[1]:'';
let sess=[],sales=[],spyF='all',ready=[false,false];
const getSess=()=>{const m=$('src').value==='meta';return sess.filter(s=>(s.product||CFG.tabs[0].key)===tab.key&&(!m||CFG.metaSrc.includes(s.utm_source||'')||!s.utm_source))};
const getSales=()=>sales.filter(s=>paid(s)&&s.product===tab.key);
// liga cada venda ao lead de checkout mais provável (mesmo plano, atividade até 3h antes da venda)
function match(S,V){const used=new Set(),map=new Map(),chk=S.filter(isChk);
  [...V].sort((a,b)=>(toDate(a.createdAt)||0)-(toDate(b.createdAt)||0)).forEach(v=>{const vt=toDate(v.createdAt);if(!vt)return;const pl=v.amount>0?(v.amount<14?'p1':'p2'):'';let best=null,bd=1/0;
    chk.forEach(s=>{if(used.has(s.id))return;if(pl&&s.clickedPlan&&s.clickedPlan!==pl)return;const lt=toDate(s.lastActivity);if(!lt)return;const d=vt-lt;if(d<-3e5||d>108e5)return;if(Math.abs(d)<bd){bd=Math.abs(d);best=s}});
    if(best){used.add(best.id);map.set(best.id,v)}});return map}
const cnt=(r,S,V)=>{const ss=S.filter(s=>inR(s.enteredAt||s.lastActivity,r)),vv=V.filter(v=>inR(v.createdAt,r));return{leads:ss.length,chk:ss.filter(isChk).length,sales:vv.length,rev:vv.reduce((a,v)=>a+net(v),0)}};
function render(){
  const S=getSess(),V=getSales(),t=cnt(range('today'),S,V),w=cnt(range('7d'),S,V);
  const h1=V.filter(v=>{const d=toDate(v.createdAt);return d&&Date.now()-d<36e5}).length;
  const sp=parseFloat(String($('spend').value).replace(',','.'))||0,onl=S.filter(online).length;
  const kp=[['var(--blue)','🟢',onl,'Online Agora'],['var(--green)','👥',t.leads,'Leads Hoje'],['#8b5cf6','🛒',t.chk,'Checkouts Hoje'],['var(--gold)','💰',t.sales,'Vendas Hoje'],['var(--green)','💵',brl(t.rev),'Receita Hoje'],['var(--gold)','💲',sp&&t.leads?brl(sp/t.leads):'—','CPL (hoje)'],['var(--blue)','📈',w.leads?(w.sales/w.leads*100).toFixed(1)+'%':'0%','Conv. 7 Dias'],['var(--red)','🕐',h1,'Vendas Última Hora']];
  $('kpis').innerHTML=kp.map(k=>`<div class="kpi"><div class="kpi-bar" style="background:${k[0]}"></div><span class="kpi-icon">${k[1]}</span><div class="kpi-v">${k[2]}</div><div class="kpi-l">${k[3]}</div></div>`).join('');
  const P=['today','yesterday','7d','30d'].map(p=>cnt(range(p),S,V));
  const rows=[['Leads',x=>x.leads],['Checkouts',x=>x.chk],['Vendas',x=>x.sales],['Receita Líq.',x=>brl(x.rev),1],['Conv. %',x=>x.leads?(x.sales/x.leads*100).toFixed(1)+'%':'0.0%']];
  $('cmp').innerHTML=rows.map((r,i)=>`<tr><td class="cl">${r[0]}</td>${P.map((x,j)=>{let b='';if(j===1&&i<4){const a=i===3?P[0].rev:r[1](P[0]),y=i===3?P[1].rev:r[1](P[1]);if(y>0){const p=Math.round((a-y)/y*100);if(p)b=`<span class="${p>0?'delta-up':'delta-down'}">${p>0?'▲':'▼'}${Math.abs(p)}%</span>`}}return`<td class="cv${j===0?' hi':''}">${r[1](x)}${b}</td>`}).join('')}</tr>`).join('');
  renderSpy();renderSales();$('st').textContent='Tempo real ativo';
}
function renderSpy(){
  const S=getSess(),V=getSales(),r30=range('30d'),S30=S.filter(s=>inR(s.enteredAt||s.lastActivity,r30)),bought=match(S30,V.filter(v=>inR(v.createdAt,r30)));
  let items=S30.map(s=>({s,sale:bought.get(s.id)}));
  const matchedSales=new Set([...bought.values()].map(v=>v.id));
  const orphans=V.filter(v=>inR(v.createdAt,r30)&&!matchedSales.has(v.id)).map(v=>({s:{id:v.id,lastActivity:v.createdAt,enteredAt:v.createdAt,utm_source:'',_o:1},sale:v}));
  if(spyF==='online')items=items.filter(x=>online(x.s));else if(spyF==='checkout')items=items.filter(x=>isChk(x.s)&&!x.sale);else if(spyF==='sale')items=[...items.filter(x=>x.sale),...orphans];
  else items=[...items,...orphans];
  items.sort((a,b)=>(toDate(b.s.lastActivity)||0)-(toDate(a.s.lastActivity)||0));items=items.slice(0,60);
  $('spy-count').textContent=items.length;
  $('spy-grid').innerHTML=items.length?items.map(({s,sale})=>{
    const on=online(s)&&!sale,chk=isChk(s)&&!sale,i=sale?7:sIdx(s),pl=planOf(s);
    const name=sale?(sale.customerName||'Cliente'):'Lead #'+String(s.sessionId||s.id).slice(-6).toUpperCase();
    const cls=sale?'sale':chk?'checkout':on?'online-now':'',bc=sale?'screen-sale':i>=6?'screen-checkout':i===5?'screen-late':i>=2?'screen-mid':'screen-early';
    const lab=sale?'✅ Comprou':'📍 '+LBL[i]+(pl&&i===6?' · '+pl:'');
    const st=Array.from({length:7},(_,k)=>sale?'sale-done':k<i?'done':k===i?'current':'').map(c=>`<div class="ss ${c}"></div>`).join('');
    const m=sale?String(sale.paymentMethod||'pix').toUpperCase():'';
    return`<div class="spy-item ${cls}"><div class="spy-av">${esc(name.replace('Lead #','').charAt(0).toUpperCase())}</div><div class="spy-b"><div class="spy-row"><div class="spy-id">${esc(name)}</div><div class="spy-t">${ago(s.lastActivity)}</div></div><div class="tela-badge ${bc}">${lab}</div><div class="spy-src">${tab.icon} ${s._o?'META':esc((s.utm_source||'direto').toUpperCase())}${on?' · 🟢':''}${m?' · '+esc(m):''}${s.device&&!s._o?' · '+esc(s.device.toUpperCase()):''}</div><div class="screen-stepper">${st}</div></div><div class="spy-r">${on?'<div class="odot"></div>':''}${chk?'<div class="bchk">CHK</div>':''}${sale?`<div class="bsale">${brl(net(sale))}</div>`:''}</div></div>`}).join(''):'<div class="empty">Nenhum lead encontrado</div>';
}
function renderSales(){
  const r=range($('sales-filter').value),list=getSales().filter(v=>inR(v.createdAt,r)).sort((a,b)=>(toDate(b.createdAt)||0)-(toDate(a.createdAt)||0)).slice(0,30);
  $('sales-list').innerHTML=list.length?list.map(v=>{const name=v.customerName||'Cliente',d=toDate(v.createdAt),m=String(v.paymentMethod||'pix').toUpperCase();
    return`<div class="sale-item"><div class="sale-av">${esc(name.charAt(0).toUpperCase())}</div><div class="sale-info"><div class="sale-name">${esc(name)}</div><div class="sale-meta"><span class="sale-method">${m==='PIX'?'⚡':'💳'} ${esc(m)}</span><span>🕐 ${d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div></div><div class="sale-amt">${brl(net(v))}</div></div>`}).join(''):'<div class="empty">Nenhuma venda no período selecionado</div>';
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{spyF=b.dataset.f;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderSpy()});
let pend=false;const sched=()=>{if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;if(ready[0]&&ready[1])render()})};
const spKey=()=>tab.legacy?'lp_spend_day':'lp_spend_day_'+tab.key;
function drawTabs(){$('ptabs').innerHTML=CFG.tabs.map(t=>`<button class="ptab${t===tab?' active':''}" data-k="${t.key}">${t.icon} ${t.name}</button>`).join('');$('ttl').textContent=tab.name+' — Meta Ads';$('lg').textContent=tab.icon;document.title=tab.name+' — Meta Ads';try{$('spend').value=localStorage.getItem(spKey())||''}catch(e){$('spend').value=''}}
try{const k=localStorage.getItem('lp_tab');tab=CFG.tabs.find(t=>t.key===k)||tab}catch(e){}
drawTabs();
$('ptabs').onclick=e=>{const b=e.target.closest('.ptab');if(!b)return;tab=CFG.tabs.find(t=>t.key===b.dataset.k)||tab;try{localStorage.setItem('lp_tab',tab.key)}catch(x){}drawTabs();sched()};
$('src').onchange=sched;$('sales-filter').onchange=renderSales;
$('spend').oninput=()=>{try{localStorage.setItem(spKey(),$('spend').value)}catch(e){}sched()};
const db=getFirestore(initializeApp(FB));
const err=()=>{$('st').textContent='Erro no Firebase'};
onSnapshot(query(collection(db,'lp_sessions'),orderBy('lastActivity','desc'),limit(800)),n=>{sess=n.docs.map(d=>({id:d.id,...d.data()}));ready[0]=true;sched()},err);
onSnapshot(query(collection(db,'sales'),orderBy('createdAt','desc'),limit(300)),n=>{sales=n.docs.map(d=>({id:d.id,...d.data()}));ready[1]=true;sched()},err);
setInterval(()=>{if(!document.hidden&&ready[0]&&ready[1])render()},15000);
</script></body></html>
